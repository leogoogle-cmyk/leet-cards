name: Build iOS IPA
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - name: Install Dependencies
      run: |
        npm ci
    - name: Build Web App and Sync
      run: |
        npm run build
        npx cap sync
    - name: Build Xcode Project
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -allowProvisioningUpdates ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
    - name: Create Unsigned IPA Package
      run: |
        mkdir -p Payload
        cp -r ios/App/build/Release-iphoneos/App.app Payload/
        zip -r LeetCards_Unsigned.ipa Payload
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LeetCards-iOS-Package
        path: LeetCards_Unsigned.ipa
